<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kembara Ilmu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
:root{
  --bg:#e8f2f6; --card:#ffffff; --ink:#1d3b44; --accent:#1f7a85; --accent-ink:#ffffff;
  --good:#3f9f74; --soft:#c9bde6; --star:#f0b43c; --line:#b9d4dc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13262c; --card:#1e3a42; --ink:#e6f2f5; --accent:#4fb3bf; --accent-ink:#0e2227;
    --good:#58bf90; --soft:#7e6fa6; --star:#f0b43c; --line:#2f545e; color-scheme:dark;
  }
}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;margin:12px 0 0;text-align:center;line-height:1.15}
p.sub{text-align:center;margin:0;font-size:1.15rem}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:1.4rem}
.stars{letter-spacing:2px;min-height:1.6em}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.big{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:26px 20px;font-size:1.7rem;font-weight:900;width:100%;min-height:92px}
.menu{display:flex;flex-direction:column;gap:20px;margin-top:8px}
.small{background:transparent;border:3px solid var(--line);border-radius:18px;padding:10px 16px;font-size:1.1rem}
.stage{background:var(--card);border-radius:32px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid var(--line)}
.pic{font-size:clamp(5rem,26vw,8rem);line-height:1.1}
.word{font-size:clamp(2.2rem,11vw,3.4rem);font-weight:900;letter-spacing:2px}
.ask{font-size:1.3rem}
.slot{display:inline-block;min-width:1.8em;border-bottom:6px solid var(--accent);color:transparent}
.slot.on{color:var(--good);border-color:var(--good)}
.say{background:var(--soft);border-radius:50%;width:76px;height:76px;font-size:2rem}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choice{background:var(--card);border:4px solid var(--line);border-radius:28px;min-height:120px;font-size:clamp(2.4rem,12vw,3.6rem);font-weight:900}
.choice.right{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{background:var(--soft);border-color:var(--soft);opacity:.7}
.msg{text-align:center;font-size:1.5rem;min-height:1.6em;font-weight:900}
.end .pic{font-size:6rem}
.row{display:flex;gap:12px}
.row .small{flex:1}
@media (prefers-reduced-motion:no-preference){
  .choice.right{transition:transform .25s}
  .choice.right{transform:scale(1.04)}
}
.tg{flex-direction:row;justify-content:center;gap:16px;padding:10px 16px}
.tg .word{color:var(--accent)}
.area{position:relative;height:min(52vh,460px);background:var(--card);border:3px solid var(--line);border-radius:28px;overflow:hidden;touch-action:none}
.lt{position:absolute;top:0;width:72px;height:72px;border-radius:50%;background:var(--bg);border:4px solid var(--line);display:grid;place-items:center;font-size:2.4rem;font-weight:900}
.pl{position:absolute;bottom:6px;width:80px;text-align:center;font-size:3.4rem;line-height:1}
.pad{min-height:72px;padding:12px}
.nm{font:inherit;font-size:1.8rem;padding:18px;border-radius:22px;border:4px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box;text-align:center}
.cert{background:#fffdf4;color:#2b2b2b;border:10px double #c9962b;border-radius:12px;padding:28px 14px;text-align:center;display:flex;flex-direction:column;gap:10px}
.cert h2{margin:0;font-size:2rem;color:#8a5f0a}
.cert .cn{font-size:2.2rem;font-weight:900;border-bottom:3px solid #c9962b;padding-bottom:6px;word-break:break-word}
.rec{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;font-size:1.1rem}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;box-sizing:border-box}}
.cv{display:block;width:100%;border-radius:28px;border:3px solid var(--line);touch-action:none}
/* hiasan kolam */
:root{--c1:#1f7a85;--c2:#2f8a62;--c3:#c2603c;--c4:#6a5bb5;--c5:#4a7fab;--ripple:rgba(31,122,133,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ripple:rgba(255,255,255,.05)}}
body{background:radial-gradient(circle at 12% 8%,var(--ripple) 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,var(--ripple) 0 90px,transparent 91px),radial-gradient(circle at 20% 92%,var(--ripple) 0 150px,transparent 151px),var(--bg);background-attachment:fixed}
#m1{background:var(--c1)}#m2{background:var(--c2)}#m3{background:var(--c3)}#m5{background:var(--c4)}#m4{background:var(--c5)}
.menu .big{color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.16)}
.menu .big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.stage{box-shadow:0 8px 0 rgba(31,122,133,.12)}
.choice{box-shadow:0 6px 0 var(--line)}
.hero{position:relative;height:140px;width:100%;display:grid;place-items:center}
.hero .frog{font-size:5.5rem;line-height:1;position:relative;z-index:1;margin-bottom:16px}
.hero .pad{position:absolute;bottom:8px;left:50%;width:160px;height:38px;margin-left:-80px;border-radius:50%;background:#7bc47f;box-shadow:inset 0 -7px 0 rgba(0,0,0,.12)}
.hero .fly{position:absolute;right:12%;top:6px;font-size:2.2rem}
@media (prefers-reduced-motion:no-preference){.hero .fly{animation:bob 3.5s ease-in-out infinite}@keyframes bob{50%{transform:translate(-14px,10px) rotate(-8deg)}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ====== DATA: guru boleh ubah senarai di bawah ====== */
// [huruf, perkataan, gambar]
const HURUF=[["A","ayam","🐔"],["B","bola","⚽"],["C","cawan","☕"],["D","dadu","🎲"],["E","epal","🍎"],["G","gajah","🐘"],["H","harimau","🐯"],["I","ikan","🐟"],["K","kucing","🐱"],["L","lembu","🐄"],["M","mata","👁️"],["N","nanas","🍍"],["P","pisang","🍌"],["R","rumah","🏠"],["T","topi","🧢"],["U","ulat","🐛"]];
// [suku kata 1, suku kata 2, gambar]
const SUKU=[["bo","la","⚽"],["to","pi","🧢"],["ku","da","🐴"],["bu","ku","📖"],["ro","ti","🍞"],["ma","ta","👁️"],["ka","ki","🦶"],["ba","ju","👕"],["i","kan","🐟"],["a","yam","🐔"]];
const BILANGAN_SOALAN=6;
/* ==================================================== */

const app=document.getElementById("app");
let mode="", qs=[], idx=0, stars=0, done=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speak(t){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ms-MY";u.rate=.75;speechSynthesis.speak(u);}catch(e){}}
function chime(){try{const C=new (window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=C.createOscillator(),g=C.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.0001;o.connect(g);g.connect(C.destination);const t=C.currentTime+i*.14;g.gain.exponentialRampToValueAtTime(.12,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.4);});}catch(e){}}

function menu(){
  mode="";
  if(!pname)return muka();
  app.innerHTML=`<h1>Hai, <span id="hn"></span>!</h1><p class="sub">Pilih satu permainan</p>
  <div class="menu">
    <button class="big" id="m1">🔤 Kenal huruf</button>
    <button class="big" id="m2">🧩 Susun suku kata</button>
    <button class="big" id="m3">🐸 Langgar huruf</button>
    <button class="big" id="m5">🏃 Pengembaraan huruf</button>
    <button class="big" id="m4">📋 Rekod dan sijil</button>
    <button class="small" id="m6">✏️ Tukar nama</button>
  </div>`;
  document.getElementById("m1").onclick=()=>start("huruf");
  document.getElementById("m2").onclick=()=>start("suku");
  document.getElementById("m3").onclick=()=>langgar();
  document.getElementById("m5").onclick=()=>pengembaraan();
  document.getElementById("m4").onclick=rekodSkrin;
  document.getElementById("m6").onclick=muka;
  document.getElementById("hn").textContent=pname;
}

function start(m){
  mode=m;lastGame=()=>start(m);
  const src=m==="huruf"?HURUF:SUKU;
  qs=shuffle(src).slice(0,Math.min(BILANGAN_SOALAN,src.length));
  idx=0;stars=0;done=false;
  round();
}

function topBar(){
  return `<div class="bar"><button class="small" id="home" aria-label="Kembali ke menu">🏠 Menu</button><span class="stars" aria-label="Bintang">${"⭐".repeat(stars)}</span></div>`;
}

function round(){
  if(idx>=qs.length)return finish();
  done=false;
  const q=qs[idx];
  let stage="",opts=[],answer="",spoken="";
  if(mode==="huruf"){
    answer=q[0];spoken=q[1];
    opts=shuffle([answer,...shuffle(HURUF.filter(h=>h[0]!==answer)).slice(0,2).map(h=>h[0])]);
    stage=`<div class="pic">${q[2]}</div><div class="word">${q[1]}</div><div class="ask">Mana huruf pertama?</div>`;
  }else{
    const miss=Math.random()<.5?0:1;
    answer=q[miss];spoken=q[0]+q[1];
    const all=[...new Set(SUKU.flatMap(s=>[s[0],s[1]]))].filter(x=>x!==answer);
    opts=shuffle([answer,...shuffle(all).slice(0,2)]);
    const a=miss===0?`<span class="slot" id="slot">${q[0]}</span>`:q[0];
    const b=miss===1?`<span class="slot" id="slot">${q[1]}</span>`:q[1];
    stage=`<div class="pic">${q[2]}</div><div class="word">${a}${b}</div><div class="ask">Mana suku kata yang hilang?</div>`;
  }
  app.innerHTML=topBar()+`<div class="stage">${stage}<button class="say" id="say" aria-label="Dengar perkataan">🔊</button></div>
  <div class="msg" id="msg"></div>
  <div class="choices">${opts.map(o=>`<button class="choice" data-v="${o}">${mode==="huruf"?o:o}</button>`).join("")}</div>`;
  document.getElementById("home").onclick=menu;
  document.getElementById("say").onclick=()=>speak(spoken);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(b,answer,spoken));
  setTimeout(()=>speak(spoken),300);
}

function pick(btn,answer,spoken){
  if(done)return;
  const msg=document.getElementById("msg");
  if(btn.dataset.v===answer){
    done=true;stars++;
    btn.classList.add("right");
    const s=document.getElementById("slot");if(s)s.classList.add("on");
    app.querySelector(".stars").textContent="⭐".repeat(stars);
    msg.textContent="Pandai! 🌟";
    chime();setTimeout(()=>speak(spoken),500);
    const next=document.createElement("button");
    next.className="big";next.textContent=idx+1<qs.length?"Seterusnya ➡️":"Siap! 🎉";
    next.onclick=()=>{idx++;round();};
    app.appendChild(next);
  }else{
    btn.classList.add("wrong");btn.disabled=true;
    msg.textContent="Cuba lagi 💛";
  }
}

function finish(){
  return sijil(stars);
  app.innerHTML=`<div class="end"><h1>Hebat!</h1><div class="stage"><div class="pic">🏆</div><div class="stars" style="font-size:2rem">${"⭐".repeat(stars)}</div></div></div>
  <div class="row"><button class="big" id="again">🔁 Main lagi</button></div>
  <button class="small" id="home">🏠 Menu</button>`;
  chime();speak("Hebat!");
  document.getElementById("again").onclick=()=>start(mode);
  document.getElementById("home").onclick=menu;
}

/* ===== Langgar huruf: 3 nyawa, rekod nama, sijil ===== */
const NYAWA=3, MATLAMAT=8;
let pname="", raf=0, lastGame=null;
try{pname=localStorage.getItem("hsk_nama")||"";}catch(e){}
function rekod(){try{return JSON.parse(localStorage.getItem("hsk_rekod")||"[]");}catch(e){return [];}}
function simpan(r){try{const a=rekod();a.unshift(r);localStorage.setItem("hsk_rekod",JSON.stringify(a.slice(0,50)));}catch(e){}}
function tarikh(){return new Date().toLocaleDateString("ms-MY",{day:"numeric",month:"long",year:"numeric"});}

function namaSkrin(f){f=f||langgar;
  app.innerHTML=`<button class="small" id="home">🏠 Menu</button><h1>Siapa nama kamu?</h1>
  <input id="nm" class="nm" maxlength="40" placeholder="Taip nama" autocomplete="off">
  <button class="big" id="go">Mula main</button>`;
  const nm=document.getElementById("nm");nm.value=pname;
  document.getElementById("home").onclick=menu;
  document.getElementById("go").onclick=()=>{const v=nm.value.trim();if(!v){nm.focus();return;}pname=v;try{localStorage.setItem("hsk_nama",v);}catch(e){}f();};
}

function langgar(){
  lastGame=langgar;cancelAnimationFrame(raf);
  const HL=HURUF.map(h=>h[0]);
  let lives=NYAWA,score=0,target="",items=[],px=0,dir=0,spawn=.3,last=0,over=false;
  app.innerHTML=`<div class="bar"><button class="small" id="home">🏠 Menu</button><span id="hp"></span><span id="sc"></span></div>
  <div class="stage tg"><span class="ask">Langgar huruf</span><span class="word" id="tg"></span><button class="say" id="say" aria-label="Dengar huruf">🔊</button></div>
  <div class="msg" id="msg"></div>
  <div class="area" id="area"><div class="pl" id="pl">🐸</div></div>
  <div class="row"><button class="big pad" id="bl" aria-label="Kiri">◀️</button><button class="big pad" id="br" aria-label="Kanan">▶️</button></div>`;
  const area=document.getElementById("area"),pl=document.getElementById("pl"),msg=document.getElementById("msg");
  const W=area.clientWidth,H=area.clientHeight;
  px=(W-80)/2;pl.style.left=px+"px";
  const hud=()=>{document.getElementById("hp").textContent="❤️".repeat(lives)+"🤍".repeat(NYAWA-lives);document.getElementById("sc").textContent="⭐ "+score+"/"+MATLAMAT;};
  const newTarget=()=>{let t;do{t=HL[Math.floor(Math.random()*HL.length)];}while(t===target);target=t;document.getElementById("tg").textContent=t;speak("huruf "+t);};
  const clear=()=>{items.forEach(i=>i.el.remove());items=[];};
  const stop=()=>{over=true;cancelAnimationFrame(raf);window.onkeydown=window.onkeyup=null;};
  function wave(){
    const cols=shuffle([0,1,2,3]).slice(0,3),tIdx=Math.random()<.75?Math.floor(Math.random()*3):-1,others=shuffle(HL.filter(x=>x!==target));
    cols.forEach((c,i)=>{const L=i===tIdx?target:others[i],el=document.createElement("div"),x=c*(W/4)+(W/4-72)/2;el.className="lt";el.textContent=L;el.style.left=x+"px";area.appendChild(el);items.push({el,L,x,y:-80});});
  }
  function hit(it){
    if(it.L===target){
      score++;chime();msg.textContent="Pandai! 🌟";clear();hud();
      if(score>=MATLAMAT){stop();return sijil(score);}
      newTarget();spawn=1.5;
    }else{
      lives--;hud();it.el.remove();items=items.filter(x=>x!==it);
      msg.textContent="Itu huruf "+it.L+". Cari huruf "+target+" 💛";
      if(lives<=0){stop();tamat(score);}
    }
  }
  function frame(ts){
    if(over)return;
    const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
    px=Math.max(0,Math.min(W-80,px+dir*280*dt));pl.style.left=px+"px";
    spawn-=dt;if(spawn<=0){wave();spawn=3.2;}
    const py=H-92;
    for(const it of items.slice()){
      it.y+=70*dt;it.el.style.transform="translateY("+it.y+"px)";
      if(it.y+72>py+10&&it.y<py+70&&it.x+72>px+8&&it.x<px+72){hit(it);if(over)return;continue;}
      if(it.y>H){it.el.remove();items=items.filter(x=>x!==it);}
    }
    raf=requestAnimationFrame(frame);
  }
  const move=e=>{const r=area.getBoundingClientRect();px=Math.max(0,Math.min(W-80,e.clientX-r.left-40));};
  area.addEventListener("pointerdown",move);area.addEventListener("pointermove",move);
  const hold=(id,d)=>{const b=document.getElementById(id);b.onpointerdown=()=>{dir=d;};["onpointerup","onpointerleave","onpointercancel"].forEach(k=>b[k]=()=>{dir=0;});};
  hold("bl",-1);hold("br",1);
  window.onkeydown=e=>{if(e.key==="ArrowLeft")dir=-1;if(e.key==="ArrowRight")dir=1;};
  window.onkeyup=e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight")dir=0;};
  document.getElementById("home").onclick=()=>{stop();menu();};
  document.getElementById("say").onclick=()=>speak("huruf "+target);
  hud();newTarget();raf=requestAnimationFrame(frame);
}

function tamat(score){
  simpan({n:pname,t:tarikh(),s:score,ok:0});
  app.innerHTML=`<h1>Cuba lagi, ${""}<span id="n"></span>!</h1><div class="stage"><div class="pic">💛</div><div class="ask">Bintang kamu: ${score}/${MATLAMAT}</div></div>
  <button class="big" id="again">🔁 Main lagi</button><button class="small" id="home">🏠 Menu</button>`;
  document.getElementById("n").textContent=pname;
  document.getElementById("again").onclick=()=>lastGame();document.getElementById("home").onclick=menu;
}

function sijil(score){
  simpan({n:pname,t:tarikh(),s:score,ok:1});chime();speak("Tahniah "+pname);
  app.innerHTML=`<div class="cert"><div style="font-size:3rem">🐸🏆🪰</div><h2>Sijil Penghargaan</h2><div>Dengan ini diperakui bahawa</div><div class="cn" id="cn"></div>
  <div>telah berjaya menamatkan permainan Kembara Ilmu dan mengumpul ⭐ ${score} bintang.</div><div>${tarikh()}</div></div>
  <button class="big" id="pr">🖨️ Cetak sijil</button>
  <div class="row"><button class="small" id="again">🔁 Main lagi</button><button class="small" id="home">🏠 Menu</button></div>`;
  document.getElementById("cn").textContent=pname;
  document.getElementById("pr").onclick=()=>{try{window.print();}catch(e){}};
  document.getElementById("again").onclick=()=>lastGame();document.getElementById("home").onclick=menu;
}

function rekodSkrin(){
  const r=rekod();
  app.innerHTML=`<button class="small" id="home">🏠 Menu</button><h1>Rekod</h1><div id="list" style="display:flex;flex-direction:column;gap:10px"></div>`;
  const list=document.getElementById("list");
  if(!r.length){list.textContent="Belum ada rekod. Jom main Langgar huruf!";}
  r.forEach(x=>{const d=document.createElement("div");d.className="rec";const a=document.createElement("span"),b=document.createElement("span");a.textContent=x.n+" · "+x.t;b.textContent=(x.ok?"🏆 ":"")+"⭐ "+x.s;d.append(a,b);list.appendChild(d);});
  document.getElementById("home").onclick=menu;
}

/* ===== Pengembaraan huruf: platformer asli ===== */
function pengembaraan(){
  lastGame=pengembaraan;cancelAnimationFrame(raf);
  const words=shuffle(SUKU.map(s=>[s[0]+s[1],s[2]])).slice(0,2),HL=HURUF.map(h=>h[0]),CH=300,GY=240;
  let wi=0,lives=NYAWA,stars=0,need=0,over=false,last=0,dir=0,jump=false,cam=0,P,items,plats,flagX,WW;
  app.innerHTML=`<div class='bar'><button class='small' id='home'>🏠 Menu</button><span id='hp'></span><span id='sc'></span></div>
  <div class='stage tg'><span class='pic' id='pw' style='font-size:3rem'></span><span class='word' id='wd'></span><button class='say' id='say' aria-label='Dengar perkataan'>🔊</button></div>
  <div class='msg' id='msg'></div><canvas class='cv' id='cv'></canvas>
  <div class='row'><button class='big pad' id='bl' aria-label='Kiri'>◀️</button><button class='big pad' id='bj' aria-label='Lompat'>⤴️</button><button class='big pad' id='br' aria-label='Kanan'>▶️</button></div>`;
  const cv=document.getElementById('cv'),CW=cv.clientWidth||340,dpr=window.devicePixelRatio||1,ctx=cv.getContext('2d'),msg=document.getElementById('msg');
  cv.width=CW*dpr;cv.height=CH*dpr;cv.style.height=CH+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  const hud=()=>{document.getElementById('hp').textContent='❤️'.repeat(lives)+'🤍'.repeat(NYAWA-lives);document.getElementById('sc').textContent='⭐ '+stars;document.getElementById('pw').textContent=words[wi][1];document.getElementById('wd').textContent=[...words[wi][0]].map((c,i)=>i<need?c.toUpperCase():'_').join(' ');};
  const stop=()=>{over=true;cancelAnimationFrame(raf);window.onkeydown=window.onkeyup=null;};
  function build(){
    const w=words[wi][0].toUpperCase(),n=w.length;plats=[];items=[];need=0;
    for(let i=0;i<n;i++){
      const x=450+i*430,hi=i%2===1,dx=x+215;
      if(hi)plats.push({x:x-65,y:GY-80,w:130});else plats.push({x:dx-65,y:GY-80,w:130});
      items.push({x:x,y:hi?GY-114:GY-34,L:w[i],got:false});
      let d;do{d=HL[Math.floor(Math.random()*HL.length)];}while(w.includes(d));
      items.push({x:dx,y:hi?GY-34:GY-114,L:d,got:false});
    }
    flagX=450+n*430+100;WW=flagX+300;P={x:60,y:GY-44,vy:0,on:true};cam=0;hud();
  }
  function update(dt){
    P.x=Math.max(0,Math.min(WW-40,P.x+dir*190*dt));
    if(jump&&P.on){P.vy=-560;P.on=false;}
    P.vy+=1500*dt;const prev=P.y;P.y+=P.vy*dt;P.on=false;
    if(P.y+44>=GY){P.y=GY-44;P.vy=0;P.on=true;}
    for(const p of plats){if(P.vy>=0&&prev+44<=p.y+2&&P.y+44>=p.y&&P.x+40>p.x&&P.x<p.x+p.w){P.y=p.y-44;P.vy=0;P.on=true;}}
    const word=words[wi][0].toUpperCase();
    for(const it of items){
      if(it.got||Math.abs(P.x+20-it.x)>34||Math.abs(P.y+22-it.y)>40)continue;
      it.got=true;
      if(it.L===word[need]){need++;stars++;chime();speak(it.L.toLowerCase());msg.textContent=need===word.length?'Pergi ke bendera! 🏁':'Pandai! 🌟';}
      else{lives--;msg.textContent='Itu huruf '+it.L+'. Cari huruf '+word[need]+' 💛';if(lives<=0){hud();stop();return tamat(stars);}}
      hud();
    }
    if(need===word.length&&P.x+40>=flagX){
      speak(words[wi][0]);wi++;
      if(wi>=words.length){stop();return sijil(stars);}
      msg.textContent='Perkataan seterusnya! 🎉';build();
    }
    cam=Math.max(0,Math.min(WW-CW,P.x-CW*.35));
  }
  function draw(){
    const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#9fd8f0');g.addColorStop(1,'#e6f6fb');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
    ctx.textBaseline='alphabetic';ctx.font='44px serif';
    for(let k=0;k<9;k++){const x=(((k*380-cam*.3)%(CW+200))+(CW+200))%(CW+200)-100;ctx.fillText('☁️',x,60+(k%3)*30);}
    ctx.fillStyle='#bfe3b0';for(let k=0;k<8;k++){ctx.beginPath();ctx.arc(k*420+100-cam*.5,GY+30,110,Math.PI,0);ctx.fill();}
    ctx.fillStyle='#7bc47f';ctx.fillRect(0,GY,CW,10);ctx.fillStyle='#b88a5a';ctx.fillRect(0,GY+10,CW,CH-GY-10);
    for(const p of plats){ctx.fillStyle='#b88a5a';ctx.fillRect(p.x-cam,p.y,p.w,16);ctx.fillStyle='#7bc47f';ctx.fillRect(p.x-cam,p.y,p.w,6);}
    ctx.fillStyle='#8a6a4a';ctx.fillRect(flagX-cam,GY-90,6,90);ctx.font='44px serif';ctx.fillText(need===words[wi][0].length?'🏁':'🚩',flagX-cam+4,GY-70);
    ctx.textAlign='center';ctx.font='bold 30px Nunito,system-ui,sans-serif';
    for(const it of items){if(it.got)continue;ctx.beginPath();ctx.arc(it.x-cam,it.y,26,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#1f7a85';ctx.stroke();ctx.fillStyle='#1d3b44';ctx.fillText(it.L,it.x-cam,it.y+11);}
    ctx.textAlign='left';ctx.font='44px serif';ctx.fillText('🐸',P.x-cam-2,P.y+40);
  }
  function frame(ts){if(over)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);if(over)return;draw();raf=requestAnimationFrame(frame);}
  const hold=(id,on,off)=>{const b=document.getElementById(id);b.onpointerdown=on;['onpointerup','onpointerleave','onpointercancel'].forEach(k=>b[k]=off);};
  hold('bl',()=>{dir=-1;},()=>{dir=0;});hold('br',()=>{dir=1;},()=>{dir=0;});hold('bj',()=>{jump=true;},()=>{jump=false;});
  window.onkeydown=e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;if(e.key===' '||e.key==='ArrowUp')jump=true;};
  window.onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')dir=0;if(e.key===' '||e.key==='ArrowUp')jump=false;};
  document.getElementById('home').onclick=()=>{stop();menu();};
  document.getElementById('say').onclick=()=>speak(words[wi][0]);
  build();speak(words[wi][0]);raf=requestAnimationFrame(frame);
}

/* ===== Muka depan ===== */
function muka(){
  mode='';
  app.innerHTML=`<div class='stage' style='margin-top:12px'><div class='hero'><span class='frog'>🐸</span><span class='fly'>🪰</span><i class='pad'></i></div><h1 style='margin:0'>Kembara Ilmu</h1><p class='sub'>Taip nama kamu untuk bermain</p></div>
  <input id='nm' class='nm' maxlength='40' placeholder='Nama kamu' autocomplete='off'>
  <div class='msg' id='mg'></div>
  <button class='big' id='go'>▶️ Mula</button>`;
  const nm=document.getElementById('nm'),go=document.getElementById('go');nm.value=pname;
  go.onclick=()=>{const v=nm.value.trim();if(!v){document.getElementById('mg').textContent='Taip nama dahulu ya 💛';nm.focus();return;}pname=v;try{localStorage.setItem('hsk_nama',v);}catch(e){}menu();};
  nm.onkeydown=e=>{if(e.key==='Enter')go.onclick();};
}

muka();
</script>
